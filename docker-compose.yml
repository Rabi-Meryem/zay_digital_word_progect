services:
  postgres:
    image: postgres:16
    container_name: zay-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: zay_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: zay1234
    ports:
      - "5432:5432"
    volumes:
      - zay_postgres_data:/var/lib/postgresql/data
  redis:
    image: redis:7
    container_name: zay-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - zay_redis_data:/data
  minio:
    image: minio/minio
    container_name: zay-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: admin123456
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - zay_minio_data:/data
volumes:
  zay_postgres_data:
  zay_redis_data:
  zay_minio_data: